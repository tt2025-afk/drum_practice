<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>純粹練鼓室 (穩定修復版)</title>
    <style>
        :root {
            --bg: #121212;
            --surface: #1e1e1e;
            --primary: #00d2d3;
            --accent: #ff6b6b;
            --text: #e0e0e0;
            --gold: #feca57;
            --blue: #54a0ff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            touch-action: manipulation;
            user-select: none;
        }

        /* 載入遮罩 */
        #loadingOverlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 100;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .spinner {
            width: 40px; height: 40px; border: 4px solid #333;
            border-top: 4px solid var(--primary); border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .load-text { color: var(--primary); font-weight: bold; }
        .start-hint { display: none; margin-top: 20px; padding: 10px 20px; background: var(--primary); color: #000; border-radius: 20px; cursor: pointer; font-weight: bold;}

        /* 上方：節拍器 */
        .header-panel {
            flex: 0 0 auto; background: var(--surface); padding: 15px;
            border-bottom: 2px solid #333; display: flex; flex-direction: column; gap: 10px; z-index: 10;
        }
        .metro-controls { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .bpm-wrapper { display: flex; align-items: center; gap: 10px; background: #000; padding: 5px 15px; border-radius: 30px; border: 1px solid #444; }
        .bpm-display { font-size: 1.5rem; font-weight: bold; color: var(--primary); font-family: monospace; width: 50px; text-align: center; }
        .btn-adjust { background: #333; color: #fff; border: none; width: 30px; height: 30px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; }
        
        .btn-metro {
            flex: 1; background: #333; color: #ccc; border: 1px solid #555; padding: 10px;
            border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer;
        }
        .btn-metro.active { background: var(--primary); color: #000; box-shadow: 0 0 15px rgba(0, 210, 211, 0.4); }

        .beat-bar { display: flex; gap: 5px; height: 6px; width: 100%; }
        .beat-dot { flex: 1; background: #333; border-radius: 3px; transition: background 0.05s; }
        .beat-dot.on { background: var(--accent); box-shadow: 0 0 10px var(--accent); }
        .beat-dot.sub { background: var(--primary); box-shadow: 0 0 8px var(--primary); }

        /* 下方：鼓盤 */
        .drum-grid {
            flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(3, 1fr);
            gap: 8px; padding: 10px; box-sizing: border-box;
        }
        .pad {
            position: relative; background: #2d3436; border-radius: 12px;
            border: 2px solid rgba(255,255,255,0.05); display: flex; flex-direction: column;
            justify-content: center; align-items: center; font-weight: bold; font-size: 1.1rem;
            box-shadow: 0 4px 0 rgba(0,0,0,0.4); transition: transform 0.05s;
            text-shadow: 1px 1px 2px #000; color: rgba(255,255,255,0.9);
        }
        .pad span { font-size: 0.75rem; color: rgba(255,255,255,0.4); margin-top: 5px; }
        .pad:active, .pad.hit { transform: translateY(4px); box-shadow: none; filter: brightness(1.4); }

        .c-gold { background: var(--gold); color: #443e00; }
        .c-blue { background: var(--blue); color: #000; }
        .c-red  { background: var(--accent); color: #fff; }
        .c-gray { background: #636e72; color: #fff; }
        .c-pink { background: #fd79a8; color: #000; }

        @media (max-width: 600px) { .pad span { display: none; } }
    </style>
</head>
<body>

    <div id="loadingOverlay">
        <div class="spinner" id="spinner"></div>
        <div class="load-text" id="loadText">下載音效中...</div>
        <div class="start-hint" id="startBtn">點擊這裡開始</div>
    </div>

    <div class="header-panel">
        <div class="metro-controls">
            <div class="bpm-wrapper">
                <button class="btn-adjust" onclick="changeBpm(-5)">-</button>
                <div class="bpm-display" id="bpmVal">100</div>
                <button class="btn-adjust" onclick="changeBpm(5)">+</button>
            </div>
            <button class="btn-metro" id="metroBtn">▶ 開啟節拍器</button>
        </div>
        <div class="beat-bar">
            <div class="beat-dot" id="dot0"></div><div class="beat-dot" id="dot1"></div>
            <div class="beat-dot" id="dot2"></div><div class="beat-dot" id="dot3"></div>
        </div>
    </div>

    <div class="drum-grid">
        <div class="pad c-gold" data-sound="crash" data-key="r">Crash<span>R</span></div>
        <div class="pad c-gold" data-sound="splash" data-key="t">Splash<span>T</span></div>
        <div class="pad c-blue" data-sound="tom1" data-key="y">Tom 1<span>Y</span></div>
        <div class="pad c-gold" data-sound="ride" data-key="u">Ride<span>U</span></div>

        <div class="pad c-pink" data-sound="openhat" data-key="d">Open HH<span>D</span></div>
        <div class="pad c-blue" data-sound="tom2" data-key="f">Tom 2<span>F</span></div>
        <div class="pad c-blue" data-sound="floor" data-key="h">Floor<span>H</span></div>
        <div class="pad c-gold" data-sound="ride" data-key="j">Bell<span>J</span></div>

        <div class="pad c-pink" data-sound="hihat" data-key="c">Hi-Hat<span>C</span></div>
        <div class="pad c-red"  data-sound="snare" data-key="v" style="grid-column: span 2">SNARE<span>V</span></div>
        <div class="pad c-gray" data-sound="kick" data-key="space">KICK<span>Space</span></div>
    </div>

    <audio id="base-kick" src="https://raw.githubusercontent.com/ArunMichaelDsouza/javascript-30-course/master/src/01-javascript-drum-kit/sounds/kick.wav" preload="auto"></audio>
    <audio id="base-snare" src="https://raw.githubusercontent.com/ArunMichaelDsouza/javascript-30-course/master/src/01-javascript-drum-kit/sounds/snare.wav" preload="auto"></audio>
    <audio id="base-hihat" src="https://raw.githubusercontent.com/ArunMichaelDsouza/javascript-30-course/master/src/01-javascript-drum-kit/sounds/hihat.wav" preload="auto"></audio>
    <audio id="base-openhat" src="https://raw.githubusercontent.com/ArunMichaelDsouza/javascript-30-course/master/src/01-javascript-drum-kit/sounds/openhat.wav" preload="auto"></audio>
    <audio id="base-tom" src="https://raw.githubusercontent.com/ArunMichaelDsouza/javascript-30-course/master/src/01-javascript-drum-kit/sounds/tom.wav" preload="auto"></audio>
    <audio id="base-crash" src="https://raw.githubusercontent.com/ArunMichaelDsouza/javascript-30-course/master/src/01-javascript-drum-kit/sounds/boom.wav" preload="auto"></audio>
    <audio id="base-ride" src="https://raw.githubusercontent.com/ArunMichaelDsouza/javascript-30-course/master/src/01-javascript-drum-kit/sounds/ride.wav" preload="auto"></audio>

<script>
    // --- 1. 音效系統 (變調重用技術) ---
    const sounds = {
        kick: { el: document.getElementById('base-kick'), rate: 1.0 },
        snare: { el: document.getElementById('base-snare'), rate: 1.0 },
        hihat: { el: document.getElementById('base-hihat'), rate: 1.0 },
        openhat: { el: document.getElementById('base-openhat'), rate: 1.0 },
        // Tom 1: 原音
        tom1: { el: document.getElementById('base-tom'), rate: 1.0 },
        // Tom 2: 借用 Tom 1，變慢(降調) 0.8 倍
        tom2: { el: document.getElementById('base-tom'), rate: 0.8 },
        // Floor: 借用 Tom 1，變慢(降調) 0.6 倍
        floor: { el: document.getElementById('base-tom'), rate: 0.6 },
        
        crash: { el: document.getElementById('base-crash'), rate: 1.0 },
        // Splash: 借用 Crash，變快(升調) 1.5 倍
        splash: { el: document.getElementById('base-crash'), rate: 1.5 },
        ride: { el: document.getElementById('base-ride'), rate: 1.0 }
    };

    function playSound(name) {
        const soundObj = sounds[name];
        if (soundObj && soundObj.el) {
            const audio = soundObj.el;
            
            // 重要：重置並設定速度
            audio.currentTime = 0;
            audio.playbackRate = soundObj.rate;
            // 某些瀏覽器需要保留音高(preservesPitch)，打擊樂器建議關閉以獲得更自然的變調效果
            if(audio.preservesPitch !== undefined) audio.preservesPitch = false; 

            const playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => { console.log("Play error:", error); });
            }
        }
    }

    // --- 2. 載入檢測 ---
    window.addEventListener('load', () => {
        // 簡單延遲確保 Audio 元素準備好
        setTimeout(() => {
            document.getElementById('spinner').style.display = 'none';
            document.getElementById('loadText').style.display = 'none';
            const btn = document.getElementById('startBtn');
            btn.style.display = 'block';
            
            btn.addEventListener('click', () => {
                // 解鎖 AudioContext (iOS 必須)
                if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if(audioCtx.state === 'suspended') audioCtx.resume();
                
                // 嘗試播放靜音以解鎖 HTML Audio 元素
                Object.values(sounds).forEach(s => {
                    s.el.muted = true;
                    s.el.play().then(() => { s.el.pause(); s.el.currentTime = 0; s.el.muted = false; }).catch(()=>{});
                });
                
                document.getElementById('loadingOverlay').style.display = 'none';
            });
        }, 1000);
    });

    // --- 3. 觸發事件 ---
    document.querySelectorAll('.pad').forEach(pad => {
        const trigger = (e) => {
            e.preventDefault(); 
            playSound(pad.dataset.sound);
            pad.classList.add('hit');
            setTimeout(() => pad.classList.remove('hit'), 80);
        };
        pad.addEventListener('touchstart', trigger, {passive: false});
        pad.addEventListener('mousedown', trigger);
    });

    document.addEventListener('keydown', (e) => {
        const key = e.key.toLowerCase();
        const selector = key === ' ' ? '[data-key="space"]' : `[data-key="${key}"]`;
        const pad = document.querySelector(selector);
        if (pad) {
            playSound(pad.dataset.sound);
            pad.classList.add('hit');
            setTimeout(() => pad.classList.remove('hit'), 80);
        }
    });

    // --- 4. 節拍器 (同前) ---
    let audioCtx = null;
    let isMetroRunning = false;
    let tempo = 100;
    let nextNoteTime = 0.0;
    let timerID = null;
    let beatCount = 0;
    const bpmVal = document.getElementById('bpmVal');
    const metroBtn = document.getElementById('metroBtn');
    const dots = [0,1,2,3].map(i => document.getElementById('dot'+i));

    function changeBpm(n) { tempo = Math.max(30, Math.min(250, tempo + n)); bpmVal.innerText = tempo; }

    function scheduleNote(beat, time) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.frequency.value = beat === 0 ? 1200 : 800;
        gain.gain.value = beat === 0 ? 0.8 : 0.4;
        osc.start(time); osc.stop(time + 0.05);

        setTimeout(() => {
            dots.forEach(d => d.className = 'beat-dot');
            dots[beat].classList.add(beat === 0 ? 'on' : 'sub');
        }, (time - audioCtx.currentTime) * 1000);
    }

    function scheduler() {
        while (nextNoteTime < audioCtx.currentTime + 0.1) {
            scheduleNote(beatCount, nextNoteTime);
            nextNoteTime += 60.0 / tempo;
            beatCount = (beatCount + 1) % 4;
        }
        timerID = setTimeout(scheduler, 25);
    }

    metroBtn.addEventListener('click', () => {
        if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if(audioCtx.state === 'suspended') audioCtx.resume();
        isMetroRunning = !isMetroRunning;
        if(isMetroRunning) {
            beatCount = 0; nextNoteTime = audioCtx.currentTime + 0.05; scheduler();
            metroBtn.classList.add('active'); metroBtn.innerText = "⏹ 停止";
        } else {
            clearTimeout(timerID); metroBtn.classList.remove('active'); metroBtn.innerText = "▶ 開始";
            dots.forEach(d => d.className = 'beat-dot');
        }
    });
</script>
</body>
</html>
