<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KKBOX 練團室 (登入修復版)</title>
    <style>
        :root {
            --kk-blue: #00a0e9;
            --bg: #121212;
            --panel: #222;
            --text: #fff;
            --accent: #00d2d3;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            touch-action: manipulation; 
        }

        /* 網址輸入區 */
        .search-box {
            width: 100%;
            display: flex; gap: 5px; margin-bottom: 10px;
        }
        input[type="text"] {
            flex: 1; padding: 10px; border-radius: 5px; border: 1px solid #555;
            background: #222; color: white; font-size: 16px;
        }
        .btn-action {
            background: #444; color: white; border: none;
            padding: 0 15px; border-radius: 5px; font-weight: bold; white-space: nowrap;
        }
        .btn-load { background: var(--kk-blue); }

        /* 登入修復區 (新功能) */
        .login-fix-area {
            width: 100%;
            background: #2a1b1b;
            border: 1px solid #ff4757;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
        }
        .login-desc { font-size: 0.85rem; color: #ffcccb; }
        .btn-login-fix {
            background: #ff4757; color: white; border: none; padding: 8px 12px;
            border-radius: 5px; font-size: 0.85rem; font-weight: bold;
        }

        /* KKBOX 區塊 */
        .kkbox-container {
            width: 100%; margin-bottom: 15px; border-radius: 12px;
            overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            background: #000; min-height: 250px;
        }

        /* 節拍器面板 */
        .metro-panel {
            width: 100%; background: var(--panel); padding: 15px;
            border-radius: 15px; box-sizing: border-box;
            border-top: 3px solid var(--accent);
        }

        /* LED */
        .leds { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; height: 15px; }
        .led { width: 15px; height: 15px; border-radius: 50%; background: #444; transition: 0.05s; }
        .led.high { background: #ff4757; box-shadow: 0 0 10px #ff4757; transform: scale(1.3); }
        .led.low { background: #2ed573; box-shadow: 0 0 10px #2ed573; }

        /* BPM & Controls */
        .bpm-display { text-align: center; font-size: 3.5rem; font-weight: 800; color: var(--text); line-height: 1; }
        .bpm-sub { font-size: 1rem; color: var(--accent); text-align: center; margin-bottom: 10px; }
        input[type=range] { width: 100%; height: 40px; margin: 10px 0; }
        .control-row { display: flex; gap: 10px; margin-bottom: 10px; }
        select { flex: 1; padding: 10px; font-size: 1rem; background: #333; color: white; border: 1px solid #555; border-radius: 8px; }

        /* 微調按鈕 */
        .nudge-controls { display: flex; gap: 10px; margin-bottom: 15px; background: #333; padding: 10px; border-radius: 10px; }
        .btn-nudge { flex: 1; padding: 10px; border: 1px solid #ff9f43; border-radius: 8px; background: #444; color: #ff9f43; font-weight: bold; }
        .btn-nudge:active { background: #ff9f43; color: #000; }

        .big-btn { width: 100%; padding: 20px; font-size: 1.5rem; font-weight: bold; border: none; border-radius: 12px; background: #444; color: #ccc; transition: 0.2s; }
        .big-btn.active { background: var(--kk-blue); color: white; box-shadow: 0 5px 20px rgba(0, 160, 233, 0.5); }
    </style>
</head>
<body>

    <div class="search-box">
        <input type="text" id="kkLink" placeholder="貼上 KKBOX 連結..." value="https://play.kkbox.com/track/SomsQ-0s1DbhbJT2AH">
        <button class="btn-action btn-load" onclick="changeSong()">載入</button>
    </div>

    <div class="login-fix-area">
        <div class="login-desc">如果無法在播放器內登入，請點右邊按鈕 →</div>
        <button class="btn-login-fix" onclick="externalLogin()">1. 開新視窗登入</button>
    </div>

    <div class="kkbox-container">
        <iframe id="kkIframe"
            src="https://widget.kkbox.com/v1/?id=SomsQ-0s1DbhbJT2AH&type=song&terr=TW&lang=TC&autoplay=false" 
            allow="autoplay; encrypted-media; clipboard-write; popups; popups-to-escape-sandbox; storage-access-by-user-activation"
            sandbox="allow-forms allow-presentation allow-same-origin allow-scripts allow-modals allow-popups allow-popups-to-escape-sandbox allow-storage-access-by-user-activation"
            style="width:100%; height:300px; border:none;">
        </iframe>
    </div>

    <div class="metro-panel">
        <div class="leds" id="leds"></div>
        <div class="bpm-display" id="bpmVal">100</div>
        <div class="bpm-sub">BPM</div>
        
        <input type="range" id="bpmRange" min="40" max="220" value="100">

        <div class="nudge-controls">
            <button class="btn-nudge" onclick="nudge(-0.05)">⏪ 微調 (-0.05)</button>
            <button class="btn-nudge" onclick="nudge(0.05)">⏩ 微調 (+0.05)</button>
        </div>

        <div class="control-row">
            <select id="timeSig"><option value="4">4/4</option><option value="3">3/4</option></select>
            <select id="subdiv"><option value="1">四分音符</option><option value="2">八分音符</option></select>
        </div>

        <button id="btnStart" class="big-btn">開始節拍器</button>
    </div>

<script>
    // --- 登入修復邏輯 ---
    function externalLogin() {
        // 開啟一個新的視窗，導向 KKBOX Widget 所在的網域進行登入
        // 這樣可以避開 iframe 的限制
        const win = window.open("https://widget.kkbox.com/v1/?id=SomsQ-0s1DbhbJT2AH&type=song", "_blank");
        
        alert("請在彈出的新視窗中完成登入。\n\n登入成功並看到完整版播放器後，請「關閉該視窗」並回到這裡，按一下「載入」重新整理！");
    }

    // --- 換歌邏輯 ---
    function changeSong() {
        let url = document.getElementById('kkLink').value.trim();
        const iframe = document.getElementById('kkIframe');
        let id = "", type = "song";
        try {
            const cleanUrl = url.split('?')[0];
            if (cleanUrl.includes("/track/")) { type = "song"; id = cleanUrl.split("/track/")[1].split("/")[0]; }
            else if (cleanUrl.includes("/song/")) { type = "song"; id = cleanUrl.split("/song/")[1].split("/")[0]; }
            else if (cleanUrl.includes("/playlist/")) { type = "playlist"; id = cleanUrl.split("/playlist/")[1].split("/")[0]; }
            
            if (id) {
                // 強制重整 iframe 以讀取新的登入狀態
                iframe.src = `https://widget.kkbox.com/v1/?id=${id}&type=${type}&terr=TW&lang=TC&autoplay=false&t=${new Date().getTime()}`;
            }
        } catch (e) { alert("網址錯誤"); }
    }

    // --- 節拍器邏輯 (同上) ---
    let audioCtx = null, isRunning = false, timerID, nextNoteTime = 0.0, tempo = 100, beatsPerBar = 4, subdivision = 1, currentStep = 0;
    const bpmRange = document.getElementById('bpmRange'), bpmVal = document.getElementById('bpmVal'), ledContainer = document.getElementById('leds'), btnStart = document.getElementById('btnStart');
    
    updateLeds();
    bpmRange.addEventListener('input', (e) => { tempo = parseInt(e.target.value); bpmVal.innerText = tempo; });
    document.getElementById('timeSig').addEventListener('change', (e) => { beatsPerBar = parseInt(e.target.value); currentStep = 0; updateLeds(); });
    document.getElementById('subdiv').addEventListener('change', (e) => { subdivision = parseInt(e.target.value); currentStep = 0; });

    window.nudge = function(amount) {
        if (!isRunning) return;
        nextNoteTime += amount;
        const btn = event.currentTarget; btn.style.background = "#fff"; setTimeout(() => { btn.style.background = "#444"; }, 100);
    };

    btnStart.addEventListener('click', () => {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        isRunning = !isRunning;
        if (isRunning) { currentStep = 0; nextNoteTime = audioCtx.currentTime + 0.1; scheduler(); btnStart.innerText = "停止"; btnStart.classList.add('active'); }
        else { clearTimeout(timerID); btnStart.innerText = "開始節拍器"; btnStart.classList.remove('active'); resetLeds(); }
    });

    function updateLeds() { ledContainer.innerHTML = ''; for(let i=0; i<beatsPerBar; i++) { let d = document.createElement('div'); d.className = 'led'; ledContainer.appendChild(d); }}
    function resetLeds() { document.querySelectorAll('.led').forEach(l => l.className = 'led'); }
    function scheduler() { while (nextNoteTime < audioCtx.currentTime + 0.1) { scheduleNote(currentStep, nextNoteTime); nextNote(); } timerID = setTimeout(scheduler, 25); }
    function nextNote() { const secondsPerBeat = 60.0 / tempo; nextNoteTime += (secondsPerBeat / subdivision); currentStep++; if (currentStep >= beatsPerBar * subdivision) currentStep = 0; }
    function scheduleNote(step, time) {
        const isMainBeat = (step % subdivision === 0);
        if (isMainBeat) {
            const beatIndex = step / subdivision; const isAccent = (beatIndex === 0);
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.frequency.value = isAccent ? 1200 : 800; gain.gain.value = isAccent ? 1.0 : 0.6;
            osc.start(time); osc.stop(time + 0.05);
            setTimeout(() => { const leds = document.querySelectorAll('.led'); leds.forEach(l => l.className = 'led'); if (leds[beatIndex]) leds[beatIndex].classList.add(isAccent ? 'high' : 'low'); }, (time - audioCtx.currentTime) * 1000);
        }
    }
</script>
</body>
</html>
